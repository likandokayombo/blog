name: GitHub Actions Bot Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot-commit:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create bot activity file
        run: |
          echo "Last checked by GitHub Actions bot: $(date)" > .github-actions-bot.txt

      - name: Build
        run: pnpm build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bot activity update [skip ci]" || echo "No changes to commit"
          git push
